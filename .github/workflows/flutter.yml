name: Flutter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart run tool/check_domain_boundaries.dart
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --debug
